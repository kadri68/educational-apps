<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذاكرة العمر</title>
    <!-- Link to Google Fonts for Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Link to Hijri.js library for Hijri date conversions (this is an external library and remains in HTML) -->
    <script src="https://unpkg.com/hijri-date@latest/dist/hijri-date.js"></script>
</head>
<body>
    <!-- Dark mode toggle button -->
    <button id="darkModeToggle">🌙</button>

    <div class="container">
        <h1>ذاكرة العمر</h1>

        <div id="current-date-time">
            <!-- Current Gregorian and Hijri date and time will be displayed here -->
        </div>

        <form id="ageCalculatorForm">
            <h2>أدخل تاريخ ميلادك</h2>

            <div class="form-group">
                <label for="dayInput">اليوم:</label>
                <input type="number" id="dayInput" min="1" max="31" placeholder="مثال: 15" required>
            </div>
            <div class="form-group">
                <label for="monthInput">الشهر:</label>
                <select id="monthInput" required>
                    <!-- Options will be dynamically populated by JavaScript -->
                </select>
            </div>
            <div class="form-group">
                <label for="yearInput">السنة:</label>
                <input type="number" id="yearInput" min="1" max="2100" placeholder="مثال: 1990" required>
            </div>

            <div class="radio-group">
                <input type="radio" id="gregorian" name="calendarType" value="gregorian" checked>
                <label for="gregorian">تقويم ميلادي</label>

                <input type="radio" id="hijri" name="calendarType" value="hijri">
                <label for="hijri">تقويم هجري</label>
            </div>

            <button type="submit">احسب العمر</button>
        </form>

        <div id="results">
            <p>النتائج ستظهر هنا بعد الحساب.</p>
        </div>

        <div class="action-buttons">
            <button id="copyInfoBtn">📋 نسخ المعلومات</button>
            <button id="printBtn">🖨️ طباعة</button>
            <button id="aboutMeBtn">👤 من أنا</button>
        </div>
    </div>

    <!-- The Modal (Who Am I - designed as a separate screen) -->
    <div id="aboutMeModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3>معلومات المطور</h3>
            <p><strong>المطور:</strong> الأستاذ محمد قادري</p>
            <p><strong>الوظيفة:</strong> أستاذ فيزياء بثانوية محمد الأخضر فيلالي، ولاية غرداية، الجزائر.</p>
            <p><strong>البريد الإلكتروني:</strong> kadri68@gmail.com</p>
            <p><strong>رقم الهاتف:</strong> 0662692987</p>
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
