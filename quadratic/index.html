<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلال المعادلات من الدرجة الثانية</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54e0;
            --accent: #f72585;
            --text: #2d3748;
            --text-light: #5a6c7d;
            --border: #e2e8f0;
            --input-bg: #f7fafc;
            --input-focus: #eef2ff;
            --result-bg: #f0fdf4;
            --result-border: #bbf7d0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', Arial, sans-serif;
            font-size: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8eef5 0%, #dce3ed 30%, #eef1f7 60%, #e3eaf3 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية زخرفية */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -120px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(79, 110, 247, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(247, 37, 133, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 28px 24px 20px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* شريط علوي ملون */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            border-radius: var(--radius) var(--radius) 0 0;
            background: linear-gradient(90deg, #4f6ef7 0%, #7c5cfc 30%, #a855f7 60%, #f72585 100%);
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }
        .header-icon .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.18);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .subtitle {
            text-align: center;
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            letter-spacing: -0.2px;
        }
        .input-group label .var-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            font-style: italic;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .var-a {
            background: linear-gradient(135deg, #f72585, #e91e63);
        }
        .var-b {
            background: linear-gradient(135deg, #7c5cfc, #6d28d9);
        }
        .var-c {
            background: linear-gradient(135deg, #4f6ef7, #3b54e0);
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 20px;
            font-family: 'Consolas', 'Courier New', 'Segoe UI', monospace;
            direction: ltr;
            text-align: left;
            background: var(--input-bg);
            color: var(--text);
            transition: var(--transition);
            outline: none;
        }
        .input-group input:focus {
            border-color: #4f6ef7;
            background: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(79, 110, 247, 0.08);
            transform: translateY(-1px);
        }
        .input-group input::placeholder {
            color: #b0bec5;
            font-size: 20px;
        }
        .input-group input:hover {
            border-color: #c4cdd9;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4f6ef7 0%, #3b54e0 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.2px;
            transition: var(--transition);
            margin-top: 6px;
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.3);
            position: relative;
            overflow: hidden;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(79, 110, 247, 0.4);
            background: linear-gradient(135deg, #5b7bf8 0%, #4b62e8 100%);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.3);
            transition: 0.1s;
        }
        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        button:active::after {
            width: 300px;
            height: 300px;
        }

        #result {
            margin-top: 18px;
            padding: 16px;
            background: var(--result-bg);
            border: 1.5px solid var(--result-border);
            border-radius: var(--radius-sm);
            direction: ltr;
            text-align: left;
            font-family: 'Consolas', 'Courier New', 'Segoe UI', monospace;
            font-size: 20px;
            line-height: 1.8;
            color: #1a3c2a;
            min-height: 50px;
            transition: var(--transition);
            word-break: break-all;
        }
        #result:empty {
            display: none;
        }
        #result.has-content {
            animation: pulseIn 0.35s ease-out;
        }
        @keyframes pulseIn {
            0% {
                transform: scale(0.97);
                opacity: 0.6;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .footer {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            padding-top: 14px;
            line-height: 1.8;
        }
        .footer .name {
            font-weight: 700;
            color: #4f6ef7;
            font-size: 13px;
        }
        .footer .school {
            font-size: 11px;
            color: #7c8a9a;
        }
        .footer .contact {
            font-size: 10.5px;
            color: #7c8a9a;
            direction: ltr;
            display: inline-block;
        }
        .footer .contact a {
            color: #4f6ef7;
            text-decoration: none;
            transition: var(--transition);
        }
        .footer .contact a:hover {
            color: #f72585;
            text-decoration: underline;
        }

        /* تجاوب مع الشاشات الصغيرة */
        @media (max-width: 540px) {
            .container {
                padding: 22px 16px 16px;
                border-radius: 14px;
            }
            h2 {
                font-size: 19px;
            }
            .input-group input {
                padding: 10px 12px;
                font-size: 14px;
            }
            button {
                padding: 11px;
                font-size: 14px;
            }
            #result {
                font-size: 22px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- أيقونة -->
        <div class="header-icon">
            <div class="icon-circle">📐</div>
        </div>
        <h2>Quadratic Equation Solver</h2>
        <p class="subtitle">ax² + bx + c = 0</p>

        <!-- المدخلات -->
        <div class="input-group">
            <label><span class="var-badge var-a">a</span> المعامل a</label>
            <input type="number" id="a" step="any" placeholder="أدخل قيمة a">
        </div>
        <div class="input-group">
            <label><span class="var-badge var-b">b</span> المعامل b</label>
            <input type="number" id="b" step="any" placeholder="أدخل قيمة b">
        </div>
        <div class="input-group">
            <label><span class="var-badge var-c">c</span> المعامل c</label>
            <input type="number" id="c" step="any" placeholder="أدخل قيمة c">
        </div>

        <button onclick="solveEquation()">✨ Calculate</button>

        <div id="result">📋 النتائج ستظهر هنا...</div>

        <!-- تذييل -->
        <div class="footer">
            <div class="name">الأستاذ محمد قادري</div>
            <div class="school">أستاذ مادة الفيزياء - ثانوية محمد الأخضر فيلالي - ولاية غرداية - الجزائر</div>
            <div class="contact">
                📧 <a href="mailto:kadri68@gmail.com">kadri68@gmail.com</a> &nbsp;|&nbsp;
                📞 <span dir="ltr">0662692987</span>
            </div>
        </div>
    </div>

    <script>
        function solveEquation() {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            const c = parseFloat(document.getElementById('c').value);
            const resDiv = document.getElementById('result');

            // إزالة الكلاس للأنيميشن ثم إضافته مرة أخرى
            resDiv.classList.remove('has-content');

            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                resDiv.innerHTML = '⚠️ Please enter valid numbers in all fields.';
                resDiv.style.background = '#fff5f5';
                resDiv.style.borderColor = '#fecaca';
                resDiv.style.color = '#991b1b';
                void resDiv.offsetWidth;
                resDiv.classList.add('has-content');
                return;
            }

            if (a === 0) {
                resDiv.innerHTML = '⚠️ This is not a quadratic equation (a = 0).<br>🔹 Please enter a non-zero value for <b>a</b>.';
                resDiv.style.background = '#fffbe6';
                resDiv.style.borderColor = '#fde68a';
                resDiv.style.color = '#92400e';
                void resDiv.offsetWidth;
                resDiv.classList.add('has-content');
                return;
            }

            // إعادة الألوان الافتراضية للنتيجة
            resDiv.style.background = '#f0fdf4';
            resDiv.style.borderColor = '#bbf7d0';
            resDiv.style.color = '#1a3c2a';

            const delta = (b * b) - (4 * a * c);
            let output = '';

            // رأس النتيجة مع الدلتا
            output += `<strong>Δ (Discriminant) = ${delta.toFixed(4)}</strong><br>`;
            output += `<span style="color:#6b7280;">━━━━━━━━━━━━━━━━━━</span><br>`;

            if (delta > 0) {
                const x1 = (-b + Math.sqrt(delta)) / (2 * a);
                const x2 = (-b - Math.sqrt(delta)) / (2 * a);
                output += '🟢 <strong>Nature:</strong> Two Real Solutions<br>';
                output += `   x₁ = <strong>${x1.toFixed(4)}</strong><br>`;
                output += `   x₂ = <strong>${x2.toFixed(4)}</strong>`;
                resDiv.style.background = '#f0fdf4';
                resDiv.style.borderColor = '#bbf7d0';
                resDiv.style.color = '#14532d';
            } else if (delta === 0) {
                const x = -b / (2 * a);
                output += '🟡 <strong>Nature:</strong> One Real Solution (Double Root)<br>';
                output += `   x₁ = x₂ = <strong>${x.toFixed(4)}</strong>`;
                resDiv.style.background = '#fffdf5';
                resDiv.style.borderColor = '#fde68a';
                resDiv.style.color = '#6d4c00';
            } else {
                const realPart = (-b / (2 * a)).toFixed(4);
                const imagPart = (Math.sqrt(-delta) / (2 * a)).toFixed(4);
                output += '🔵 <strong>Nature:</strong> Two Complex Solutions<br>';
                output += `   x₁ = ${realPart} <strong>+</strong> ${imagPart}i<br>`;
                output += `   x₂ = ${realPart} <strong>−</strong> ${imagPart}i`;
                resDiv.style.background = '#f5f7ff';
                resDiv.style.borderColor = '#c7d2fe';
                resDiv.style.color = '#1e1b4b';
            }

            resDiv.innerHTML = output;
            void resDiv.offsetWidth;
            resDiv.classList.add('has-content');
        }

        // دعم الضغط على Enter للانتقال بين الحقول وتنفيذ العملية
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach((input, index) => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            solveEquation();
                        }
                    }
                });
            });
            // تركيز تلقائي على أول حقل
            if (inputs.length > 0) {
                inputs[0].focus();
            }
        });
    </script>

</body>
</html>
