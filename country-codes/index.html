<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 المرجع العالمي للأرقام والرموز الهاتفية - نسخة شاملة</title>
    <meta name="theme-color" content="#1a73e8">
    <style>
        :root {
            --bg:#f8fafc; --surface:#fff; --surface2:#f1f5f9; --text:#1e293b; --text2:#64748b;
            --primary:#1a73e8; --primary-light:#e8f0fe; --border:#e2e8f0; --shadow:0 1px 3px rgba(0,0,0,.08);
            --shadow-lg:0 10px 25px rgba(0,0,0,.1); --radius:16px; --radius-sm:10px; --transition:0.2s;
            --font-size:15px; --font-size-sm:13px; --font-size-lg:17px; --accent:#ea4335; --success:#0d904f;
            --card-hover:#f8fafc;
        }
        .dark { --bg:#0f172a; --surface:#1e293b; --surface2:#273449; --text:#e2e8f0; --text2:#94a3b8;
            --primary:#8ab4f8; --primary-light:#1a2a4a; --border:#334155; --card-hover:#273449; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Segoe UI','Tajawal',sans-serif; background:var(--bg); color:var(--text);
            font-size:var(--font-size); line-height:1.6; transition:all var(--transition); min-height:100vh; overflow-x:hidden; }
        .header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px;
            position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .header .logo { font-size:22px; font-weight:800; color:var(--primary); white-space:nowrap; }
        .search-container { flex:1; min-width:200px; position:relative; }
        .search-container input { width:100%; padding:12px 44px 12px 16px; border:2px solid var(--border);
            border-radius:30px; font-size:var(--font-size); background:var(--surface2); color:var(--text);
            transition:all var(--transition); font-family:inherit; outline:none; }
        .search-container input:focus { border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-light); }
        .voice-btn { position:absolute; left:12px; top:50%; transform:translateY(-50%); background:none;
            border:none; font-size:20px; cursor:pointer; color:var(--text2); padding:4px 8px; border-radius:50%; }
        .voice-btn:hover { color:var(--primary); }
        .tabs { display:flex; gap:4px; flex-wrap:wrap; padding:8px 16px; background:var(--surface);
            border-bottom:1px solid var(--border); position:sticky; top:70px; z-index:99; overflow-x:auto; }
        .tab-btn { padding:8px 16px; border-radius:20px; border:1.5px solid var(--border);
            background:var(--surface); color:var(--text2); cursor:pointer; font-size:var(--font-size-sm);
            font-weight:600; white-space:nowrap; transition:all var(--transition); font-family:inherit; }
        .tab-btn:hover { background:var(--primary-light); color:var(--primary); }
        .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .main-content { padding:16px; max-width:1300px; margin:0 auto; }
        .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
        .card { background:var(--surface); border-radius:var(--radius); padding:16px; border:1px solid var(--border);
            cursor:pointer; transition:all var(--transition); box-shadow:var(--shadow); display:flex;
            align-items:center; gap:12px; position:relative; }
        .card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); border-color:var(--primary); }
        .card .flag { font-size:36px; flex-shrink:0; width:48px; text-align:center; }
        .card .info { flex:1; min-width:0; }
        .card .info .name { font-weight:700; color:var(--text); }
        .card .info .sub { font-size:var(--font-size-sm); color:var(--text2); }
        .code-badge { background:var(--primary-light); color:var(--primary); padding:6px 12px;
            border-radius:20px; font-weight:700; font-size:var(--font-size-sm); cursor:pointer; flex-shrink:0; }
        .code-badge:hover { background:var(--primary); color:#fff; }
        .fav-star { position:absolute; top:8px; left:8px; font-size:18px; cursor:pointer; opacity:0.4;
            background:none; border:none; color:inherit; }
        .fav-star.active { opacity:1; color:#f9ab00; }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333;
            color:#fff; padding:10px 24px; border-radius:30px; font-weight:600; z-index:9999;
            animation:toastIn .3s,toastOut .3s 1.5s forwards; pointer-events:none; }
        @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
        @keyframes toastOut { from{opacity:1;} to{opacity:0;transform:translateX(-50%) translateY(20px);} }
        .stats-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
        .stat-chip { background:var(--surface); border:1px solid var(--border); border-radius:20px;
            padding:6px 14px; font-size:var(--font-size-sm); font-weight:600; color:var(--text2); }
        .stat-chip strong { color:var(--primary); }
        .filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
        .filter-row select,.filter-row button { padding:8px 14px; border-radius:20px;
            border:1.5px solid var(--border); font-size:var(--font-size-sm); font-family:inherit;
            cursor:pointer; background:var(--surface); color:var(--text); font-weight:500; }
        .filter-row button { background:var(--primary); color:#fff; border-color:var(--primary); }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200;
            display:flex; align-items:center; justify-content:center; padding:16px; }
        .modal { background:var(--surface); border-radius:var(--radius); padding:24px;
            max-width:500px; width:100%; max-height:80vh; overflow-y:auto; }
        .modal .close-btn { float:left; background:none; border:none; font-size:24px; cursor:pointer; color:var(--text2); }
        .hidden { display:none!important; }
        .no-results { text-align:center; padding:40px; color:var(--text2); font-size:var(--font-size-lg); grid-column:1/-1; }
        .settings-grid { display:grid; gap:12px; grid-column:1/-1; }
        .setting-item { display:flex; align-items:center; justify-content:space-between;
            padding:12px; background:var(--surface2); border-radius:var(--radius-sm); }
        .toggle-switch { width:50px; height:28px; background:var(--border); border-radius:14px;
            position:relative; cursor:pointer; }
        .toggle-switch.on { background:var(--primary); }
        .toggle-switch::after { content:''; position:absolute; width:24px; height:24px;
            border-radius:50%; background:#fff; top:2px; left:2px; transition:all var(--transition); }
        .toggle-switch.on::after { left:24px; }
        @media(max-width:600px){ .cards-grid{grid-template-columns:1fr;} .header{padding:8px 10px;}
            .tab-btn{padding:6px 10px;font-size:11px;} }
        @media print{ .header,.tabs,.filter-row,.voice-btn,.fav-star,.code-badge,.stats-bar,.toast{display:none!important;}
            .card{break-inside:avoid;border:1px solid #ccc;} body{background:#fff;color:#000;} }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🌍 المرجع العالمي الشامل</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن دولة، ولاية، مكتب بريد، رمز..." autocomplete="off">
            <button class="voice-btn" id="voiceBtn" title="بحث صوتي">🎤</button>
        </div>
    </header>
    <nav class="tabs" id="tabsContainer">
        <button class="tab-btn active" data-tab="countries">🌐 الدول (195)</button>
        <button class="tab-btn" data-tab="wilayas">🇩🇿 الولايات (58)</button>
        <button class="tab-btn" data-tab="postal">📮 مكاتب البريد</button>
        <button class="tab-btn" data-tab="emergency">🚨 الطوارئ</button>
        <button class="tab-btn" data-tab="telecom">📞 الاتصالات</button>
        <button class="tab-btn" data-tab="banks">🏦 البنوك</button>
        <button class="tab-btn" data-tab="hospitals">🏥 المستشفيات</button>
        <button class="tab-btn" data-tab="police">👮 مراكز الشرطة</button>
        <button class="tab-btn" data-tab="dairas">🏘️ الدوائر</button>
        <button class="tab-btn" data-tab="favorites">⭐ المفضلة</button>
        <button class="tab-btn" data-tab="settings">⚙️ الإعدادات</button>
    </nav>
    <main class="main-content" id="mainContent">
        <div class="stats-bar" id="statsBar"></div>
        <div class="filter-row" id="filterRow"></div>
        <div class="cards-grid" id="cardsGrid"></div>
        <div id="resultsCount" style="text-align:center;padding:8px;color:var(--text2);font-size:var(--font-size-sm)"></div>
    </main>
    <div class="toast hidden" id="toast"></div>
    <div class="modal-overlay hidden" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script>
        // ==================== APP CORE ====================
        let DB = null;
        let currentTab = 'countries';
        let favorites = JSON.parse(localStorage.getItem('fav_v2') || '{"countries":[],"wilayas":[],"postOffices":[]}');
        let settings = JSON.parse(localStorage.getItem('set_v2') || '{"darkMode":false,"fontSize":"normal","sortOrder":"asc"}');
        let searchHistory = JSON.parse(localStorage.getItem('sh_v2') || '[]');
        let lastSearch = '';

        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        // Load data from external JSON
        async function loadData() {
            try {
                const cacheKey = 'app_data_v2';
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    DB = JSON.parse(cached);
                    console.log('📦 تم تحميل البيانات من التخزين المحلي');
                } else {
                    const resp = await fetch('data.json');
                    if (!resp.ok) throw new Error('فشل تحميل البيانات');
                    DB = await resp.json();
                    localStorage.setItem(cacheKey, JSON.stringify(DB));
                    console.log('🌐 تم تحميل البيانات من الملف الخارجي وتخزينها محلياً');
                }
                console.log(`✅ ${DB.countries.length} دولة | ${DB.wilayas.length} ولاية | ${DB.postOffices.length} مكتب بريد`);
                initApp();
            } catch (err) {
                console.error('خطأ:', err);
                $('#cardsGrid').innerHTML = `<div class="no-results">
                    ⚠️ تعذر تحميل البيانات. تأكد من وجود ملف data.json في نفس المجلد.
                    <br><small>${err.message}</small>
                </div>`;
            }
        }

        function initApp() {
            applySettings();
            switchTab('countries');
            setupEvents();
            // Service Worker for offline
            if ('serviceWorker' in navigator) {
                const swCode = `self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok){const c=res.clone();caches.open('v2').then(cache=>cache.put(e.request,c));}return res;}).catch(()=>caches.match(e.request))));});`;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }
        }

        function applySettings() {
            document.body.classList.toggle('dark', settings.darkMode);
            const sizes = { small: '13px', normal: '15px', large: '18px' };
            document.documentElement.style.setProperty('--font-size', sizes[settings.fontSize] || '15px');
            document.documentElement.style.setProperty('--font-size-sm', (parseInt(sizes[settings.fontSize]) - 2) + 'px');
            document.documentElement.style.setProperty('--font-size-lg', (parseInt(sizes[settings.fontSize]) + 2) + 'px');
        }

        function saveSettings() { localStorage.setItem('set_v2', JSON.stringify(settings));
            applySettings(); }

        function saveFavorites() { localStorage.setItem('fav_v2', JSON.stringify(favorites)); }

        function showToast(msg) { const t = $('#toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000); }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => showToast('✅ تم النسخ: ' + text)).catch(() => showToast(
                '⚠️ تعذر النسخ'));
        }

        function toggleFav(cat, id) {
            const arr = favorites[cat];
            const idx = arr.indexOf(id);
            idx > -1 ? arr.splice(idx, 1) : arr.push(id);
            saveFavorites();
            if (['favorites', cat].includes(currentTab)) renderTab();
            return idx === -1;
        }

        function isFav(cat, id) { return favorites[cat]?.includes(id); }

        function openModal(title, content) {
            $('#modalContent').innerHTML =
                `<button class="close-btn" onclick="$('#modalOverlay').classList.add('hidden')">✕</button><h3>${title}</h3>${content}`;
            $('#modalOverlay').classList.remove('hidden');
        }
        $('#modalOverlay').addEventListener('click', e => { if (e.target === $('#modalOverlay')) $('#modalOverlay')
                .classList.add('hidden'); });

        function getData() {
            const map = {
                countries: DB.countries,
                wilayas: DB.wilayas,
                postal: DB.postOffices,
                emergency: DB.emergency,
                telecom: DB.telecom,
                banks: DB.banks,
                hospitals: DB.hospitals,
                police: DB.policeStations,
                dairas: DB.dairas || [],
                favorites: []
            };
            if (currentTab === 'favorites') {
                const res = [];
                favorites.countries.forEach(id => { const c = DB.countries.find(x => x.iso2 === id || x.code ===
                        id); if (c) res.push({ ...c, _type: 'country' }); });
                favorites.wilayas.forEach(id => { const w = DB.wilayas.find(x => x.id == id); if (w) res.push({ ...w,
                        _type: 'wilaya' }); });
                favorites.postOffices.forEach(id => { const p = DB.postOffices.find(x => x.postalCode === id); if (
                        p) res.push({ ...p, _type: 'postal' }); });
                return res;
            }
            return map[currentTab] || [];
        }

        function filterData(data, q) {
            if (!q) return data;
            const lq = q.toLowerCase().trim();
            return data.filter(item => Object.values(item).some(v => String(v).toLowerCase().includes(lq)));
        }

        function sortData(data) {
            return [...data].sort((a, b) => {
                const na = String(a.nameAr || a.name || a.nameFr || '').toLowerCase();
                const nb = String(b.nameAr || b.name || b.nameFr || '').toLowerCase();
                return settings.sortOrder === 'desc' ? nb.localeCompare(na, 'ar') : na.localeCompare(nb, 'ar');
            });
        }

        function renderTab() {
            let data = getData();
            const query = $('#searchInput').value;
            data = filterData(data, query);
            if (currentTab === 'countries') {
                const cf = $('#continentFilter');
                if (cf && cf.value) data = data.filter(c => c.continent === cf.value);
            }
            data = sortData(data);

            $('#statsBar').innerHTML = `
                <span class="stat-chip">📊 النتائج: <strong>${data.length}</strong></span>
                <span class="stat-chip">🌍 الدول: <strong>${DB.countries.length}</strong></span>
                <span class="stat-chip">🇩🇿 الولايات: <strong>${DB.wilayas.length}</strong></span>
                <span class="stat-chip">📮 مكاتب البريد: <strong>${DB.postOffices.length}</strong></span>
                <span class="stat-chip">⭐ المفضلة: <strong>${favorites.countries.length+favorites.wilayas.length+favorites.postOffices.length}</strong></span>
                ${lastSearch?`<span class="stat-chip">🔍 بحث: <strong>${lastSearch}</strong></span>`:''}
            `;

            // Filter row
            if (currentTab === 'countries') {
                const conts = [...new Set(DB.countries.map(c => c.continent))];
                $('#filterRow').innerHTML = `
                    <select id="continentFilter" onchange="renderTab()"><option value="">🌍 كل القارات</option>
                        ${conts.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
                    <select id="sortOrder" onchange="settings.sortOrder=this.value;saveSettings();renderTab();">
                        <option value="asc" ${settings.sortOrder==='asc'?'selected':''}>🔠 تصاعدي</option>
                        <option value="desc" ${settings.sortOrder==='desc'?'selected':''}>🔡 تنازلي</option></select>
                    <button onclick="exportCSV()">📥 CSV</button>
                    <button onclick="window.print()">🖨️ طباعة</button>
                `;
            } else if (['wilayas', 'postal', 'banks', 'hospitals', 'police', 'dairas'].includes(currentTab)) {
                $('#filterRow').innerHTML = `
                    <select id="sortOrder" onchange="settings.sortOrder=this.value;saveSettings();renderTab();">
                        <option value="asc" ${settings.sortOrder==='asc'?'selected':''}>🔠 تصاعدي</option>
                        <option value="desc" ${settings.sortOrder==='desc'?'selected':''}>🔡 تنازلي</option></select>
                    <button onclick="exportCSV()">📥 CSV</button>
                    <button onclick="window.print()">🖨️ طباعة</button>
                `;
            } else {
                $('#filterRow').innerHTML = `<button onclick="exportCSV()">📥 CSV</button><button onclick="window.print()">🖨️ طباعة</button>`;
            }

            $('#resultsCount').textContent = `📋 تم العثور على ${data.length} نتيجة`;
            const grid = $('#cardsGrid');
            grid.innerHTML = '';
            if (!data.length) { grid.innerHTML = '<div class="no-results">😕 لا توجد نتائج</div>'; return; }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                if (currentTab === 'countries') {
                    const fv = isFav('countries', item.iso2) ? 'active' : '';
                    card.innerHTML = `
                        <button class="fav-star ${fv}" onclick="event.stopPropagation();toggleFav('countries','${item.iso2}');renderTab();">⭐</button>
                        <div class="flag">${item.flag}</div><div class="info"><div class="name">${item.nameAr}</div>
                        <div class="sub">${item.nameEn} | ${item.capital} | ${item.continent}</div>
                        <div class="sub">ISO: ${item.iso2}/${item.iso3} | 👥 ${(item.population||0).toLocaleString()}</div></div>
                        <div class="code-badge" onclick="event.stopPropagation();copyText('${item.code}')">${item.code}</div>`;
                    card.onclick = () => openModal(`${item.flag} ${item.nameAr}`,
                        `<p><b>الاسم:</b> ${item.nameEn}</p><p><b>رمز الاتصال:</b> <span style="color:var(--primary);cursor:pointer" onclick="copyText('${item.code}')">${item.code} 📋</span></p>
                         <p><b>العاصمة:</b> ${item.capital}</p><p><b>القارة:</b> ${item.continent}</p><p><b>السكان:</b> ${(item.population||0).toLocaleString()}</p>
                         <p><b>ISO2:</b> ${item.iso2} | <b>ISO3:</b> ${item.iso3}</p>
                         <button onclick="shareData('${item.nameAr}: ${item.code}')" style="margin:4px;padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;background:var(--surface);color:var(--text);font-family:inherit;">📤 مشاركة</button>`);
                } else if (currentTab === 'wilayas') {
                    const fv = isFav('wilayas', item.id) ? 'active' : '';
                    card.innerHTML = `
                        <button class="fav-star ${fv}" onclick="event.stopPropagation();toggleFav('wilayas',${item.id});renderTab();">⭐</button>
                        <div class="flag">🏛️</div><div class="info"><div class="name">${item.id}. ${item.nameAr}</div>
                        <div class="sub">${item.nameFr} | 📬 ${item.postalCode} | 📞 ${item.phoneCode}</div>
                        <div class="sub">🏘️ ${item.municipalities} بلدية | 📐 ${(item.area||0).toLocaleString()} كم²</div></div>
                        <div class="code-badge" onclick="event.stopPropagation();copyText('${item.phoneCode}')">${item.phoneCode}</div>`;
                    card.onclick = () => openModal(`🏛️ ${item.nameAr}`,
                        `<p><b>الرقم:</b> ${item.id}</p><p><b>بالفرنسية:</b> ${item.nameFr}</p><p><b>الرمز البريدي:</b> ${item.postalCode}</p>
                         <p><b>رمز الهاتف:</b> ${item.phoneCode}</p><p><b>العاصمة:</b> ${item.capital}</p><p><b>البلديات:</b> ${item.municipalities}</p>
                         <p><b>المساحة:</b> ${(item.area||0).toLocaleString()} كم²</p>`);
                } else if (currentTab === 'postal') {
                    const fv = isFav('postOffices', item.postalCode) ? 'active' : '';
                    card.innerHTML = `
                        <button class="fav-star ${fv}" onclick="event.stopPropagation();toggleFav('postOffices','${item.postalCode}');renderTab();">⭐</button>
                        <div class="flag">📮</div><div class="info"><div class="name">${item.name}</div>
                        <div class="sub">${item.commune} - ${item.wilaya} | 📬 ${item.postalCode}</div>
                        <div class="sub">📞 ${item.phone||'غير متوفر'} | 📍 ${item.lat?item.lat.toFixed(4):'-'}, ${item.lng?item.lng.toFixed(4):'-'}</div></div>
                        <div class="code-badge" onclick="event.stopPropagation();copyText('${item.postalCode}')">${item.postalCode}</div>`;
                    card.onclick = () => openModal(`📮 ${item.name}`,
                        `<p><b>الولاية:</b> ${item.wilaya}</p><p><b>البلدية:</b> ${item.commune}</p><p><b>الرمز البريدي:</b> ${item.postalCode}</p>
                         <p><b>العنوان:</b> ${item.address}</p><p><b>الهاتف:</b> ${item.phone||'غير متوفر'}</p>
                         ${item.lat?`<p><b>الإحداثيات:</b> ${item.lat}, ${item.lng}</p><p><a href="https://www.google.com/maps?q=${item.lat},${item.lng}" target="_blank" style="color:var(--primary)">📍 فتح في الخريطة</a></p>`:''}`);
                } else if (currentTab === 'emergency') {
                    card.innerHTML = `
                        <div class="flag">${item.icon}</div><div class="info"><div class="name">${item.name}</div>
                        <div class="sub">${item.category||'طوارئ'}</div></div>
                        <div class="code-badge" onclick="event.stopPropagation();copyText('${item.number}')" style="background:#fce8e6;color:var(--accent);">${item.number}</div>`;
                } else if (currentTab === 'telecom') {
                    card.innerHTML = `
                        <div class="flag">${item.icon}</div><div class="info"><div class="name">${item.name}</div>
                        <div class="sub">${item.type} | خدمة: ${item.support} | ${item.codes.join(', ')}</div></div>
                        <div class="code-badge" onclick="event.stopPropagation();copyText('${item.codes[0]}')">${item.codes[0]}</div>`;
                } else if (currentTab === 'banks') {
                    card.innerHTML = `
                        <div class="flag">🏦</div><div class="info"><div class="name">${item.name}</div>
                        <div class="sub">${item.wilaya} | ${item.address}</div><div class="sub">📞 ${item.phone}</div></div>`;
                } else if (currentTab === 'hospitals') {
                    card.innerHTML = `
                        <div class="flag">🏥</div><div class="info"><div class="name">${item.name}</div>
                        <div class="sub">${item.wilaya} - ${item.commune} | ${item.type} | 🛏️ ${item.beds||'?'} سرير</div>
                        <div class="sub">📞 ${item.phone}</div></div>`;
                } else if (currentTab === 'police') {
                    card.innerHTML = `
                        <div class="flag">👮</div><div class="info"><div class="name">${item.name}</div>
                        <div class="sub">${item.wilaya} - ${item.commune||''} | ${item.address||''}</div>
                        <div class="sub">📞 ${item.phone}</div></div>`;
                } else if (currentTab === 'dairas') {
                    card.innerHTML = `
                        <div class="flag">🏘️</div><div class="info"><div class="name">${item.nameAr}</div>
                        <div class="sub">الولاية: ${item.wilayaId} | البلديات: ${item.communesCount||'?'}</div></div>`;
                } else if (currentTab === 'favorites') {
                    card.innerHTML = `
                        <div class="flag">⭐</div><div class="info"><div class="name">${item.nameAr||item.name||item.nameFr}</div>
                        <div class="sub">النوع: ${item._type||'?'}</div></div>`;
                }
                grid.appendChild(card);
            });
        }

        function exportCSV() {
            const data = getData();
            const filtered = filterData(data, $('#searchInput').value);
            if (!filtered.length) return showToast('لا توجد بيانات');
            const headers = Object.keys(filtered[0]).filter(k => !k.startsWith('_'));
            let csv = '\uFEFF' + headers.join(',') + '\n';
            filtered.forEach(r => { csv += headers.map(h => '"' + String(r[h] || '').replace(/"/g,
                    '""') + '"').join(',') + '\n'; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${currentTab}_export.csv`;
            a.click();
            showToast('📥 تم التحميل');
        }

        function shareData(text) {
            if (navigator.share) navigator.share({ title: 'مشاركة', text }).catch(() => {});
            else copyText(text);
        }

        function switchTab(tab) {
            if (tab === 'settings') {
                currentTab = 'settings';
                $$('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-tab="settings"]`)?.classList.add('active');
                $('#searchInput').value = '';
                renderSettings();
                return;
            }
            currentTab = tab;
            $$('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
            $('#searchInput').value = '';
            lastSearch = '';
            renderTab();
        }

        function renderSettings() {
            $('#statsBar').innerHTML = '';
            $('#filterRow').innerHTML = '';
            $('#resultsCount').textContent = '';
            $('#cardsGrid').innerHTML = `
                <div class="settings-grid">
                    <div class="setting-item"><label>🌙 الوضع الليلي</label><div class="toggle-switch ${settings.darkMode?'on':''}" onclick="settings.darkMode=!settings.darkMode;saveSettings();renderSettings();"></div></div>
                    <div class="setting-item"><label>🔤 حجم الخط</label><select onchange="settings.fontSize=this.value;saveSettings();" style="padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);font-family:inherit;background:var(--surface);color:var(--text);"><option value="small" ${settings.fontSize==='small'?'selected':''}>صغير</option><option value="normal" ${settings.fontSize==='normal'?'selected':''}>متوسط</option><option value="large" ${settings.fontSize==='large'?'selected':''}>كبير</option></select></div>
                    <div class="setting-item"><label>📤 تصدير المفضلة</label><button onclick="exportFav()" style="padding:8px 16px;border-radius:20px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-family:inherit;">تصدير JSON</button></div>
                    <div class="setting-item"><label>📥 استيراد المفضلة</label><input type="file" accept=".json" onchange="importFav(event)" style="font-family:inherit;"></div>
                    <div class="setting-item"><label>🗑️ مسح المفضلة</label><button onclick="if(confirm('متأكد؟')){favorites={countries:[],wilayas:[],postOffices:[]};saveFavorites();renderSettings();showToast('تم المسح');}" style="padding:8px 16px;border-radius:20px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;">مسح الكل</button></div>
                    <div class="setting-item"><label>📋 سجل البحث (${searchHistory.length})</label><button onclick="searchHistory=[];localStorage.setItem('sh_v2','[]');renderSettings();showToast('تم مسح السجل');" style="padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;background:var(--surface);color:var(--text);font-family:inherit;">مسح السجل</button></div>
                    <div class="setting-item"><label>🔄 تحديث البيانات من الملف</label><button onclick="localStorage.removeItem('app_data_v2');location.reload();" style="padding:8px 16px;border-radius:20px;border:none;background:var(--success);color:#fff;cursor:pointer;font-family:inherit;">تحديث الآن</button></div>
                </div>`;
        }

        function exportFav() {
            const blob = new Blob([JSON.stringify(favorites, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'favorites.json';
            a.click();
            showToast('📤 تم التصدير');
        }

        function importFav(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => {
                try {
                    const d = JSON.parse(ev.target.result); if (d.countries && d.wilayas && d.postOffices) { favorites =
                            d;
                        saveFavorites();
                        showToast('📥 تم الاستيراد');
                        renderSettings(); } else showToast('⚠️ ملف غير صالح');
                } catch { showToast('⚠️ خطأ'); }
            };
            r.readAsText(f);
        }

        function setupEvents() {
            $('#tabsContainer').addEventListener('click', e => {
                const btn = e.target.closest('.tab-btn');
                if (btn) switchTab(btn.dataset.tab);
            });
            $('#searchInput').addEventListener('input', () => {
                lastSearch = $('#searchInput').value;
                if (currentTab !== 'settings') renderTab();
            });
            $('#voiceBtn').addEventListener('click', () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return showToast('⚠️ غير مدعوم');
                const rec = new SR();
                rec.lang = 'ar-SA';
                rec.start();
                rec.onresult = e => { $('#searchInput').value = e.results[0][0].transcript;
                    lastSearch = $('#searchInput').value; if (currentTab !== 'settings') renderTab(); };
                rec.onerror = () => showToast('⚠️ خطأ صوتي');
            });
            document.addEventListener('keydown', e => {
                if (e.ctrlKey && e.key === 'k') { e.preventDefault();
                    $('#searchInput').focus();
                    $('#searchInput').select(); }
                if (e.key === 'Escape') { $('#modalOverlay').classList.add('hidden'); }
            });
            $('#modalOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.add(
                    'hidden'); });
        }

        // Start
        loadData();
    </script>
</body>
</html>
