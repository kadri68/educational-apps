let currentCategory = '';

// دالة تصفية المواقع حسب الفئة
function filterSites(category) {
    currentCategory = category;
    const container = document.getElementById('sitesContainer');
    container.innerHTML = ''; 

    // إبراز الزر النشط
    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    // جلب المواقع التي تطابق الفئة المحددة
    const filteredSites = sitesData.filter(site => site.cat === category);
    
    // إنشاء البطاقات
    filteredSites.forEach(site => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = site.url;
        card.target = '_blank';
        
        card.innerHTML = `
            <div class="icon">${site.icon}</div>
            <h3>${site.name}</h3>
            <p>${site.desc}</p>
        `;
        container.appendChild(card);
    });
}

// دالة البحث داخل المواقع المعروضة حالياً
function searchSites() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    
    // إذا لم يتم اختيار فئة بعد، نعرض رسالة أو لا نبحث
    if (!currentCategory) return; 

    let cards = document.getElementsByClassName('card');

    for (let i = 0; i < cards.length; i++) {
        let text = cards[i].innerText.toLowerCase();
        if (text.includes(input)) {
            cards[i].style.display = 'flex';
        } else {
            cards[i].style.display = 'none';
        }
    }
}
